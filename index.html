<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══ App Header ═══ -->
  <header class="app-header">
    <h1 class="app-title">📋 Task Manager</h1>
    <input type="text" id="searchBox" class="search-box" placeholder="搜索…">
    <button id="themeToggle" class="theme-toggle" aria-label="切换深色模式">🌙</button>
    <button id="addTaskBtn" class="add-task-btn">+ 新建任务</button>
  </header>

  <!-- ═══ Kanban Board ═══ -->
  <main id="kanbanBoard" class="kanban-board"></main>

  <!-- ═══ Modal (新增 / 编辑 / 确认) ═══ -->
  <div id="taskModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">新建任务</h2>
        <button class="modal-close" aria-label="关闭">✕</button>
      </div>

      <!-- ── 表单视图 ── -->
      <div class="form-view">
        <form id="taskForm">
          <div class="form-group">
            <label for="taskTitle">标题 *</label>
            <input type="text" id="taskTitle" required placeholder="任务标题">
          </div>
          <div class="form-group">
            <label for="taskDescription">描述</label>
            <textarea id="taskDescription" placeholder="描述（选填）"></textarea>
          </div>
          <div class="form-group">
            <label for="taskDueDate">截止日期</label>
            <input type="date" id="taskDueDate">
          </div>
          <div class="form-group">
            <label for="taskPriority">优先级</label>
            <select id="taskPriority">
              <option value="high">🔴 高</option>
              <option value="medium" selected>🟡 中</option>
              <option value="low">🟢 低</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskStatus">状态</label>
            <select id="taskStatus">
              <option value="todo">📋 待办</option>
              <option value="in-progress">🔄 进行中</option>
              <option value="done">✅ 完成</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" id="deleteBtn" class="btn btn-danger" style="display:none" onclick="modal.deleteTask()">删除</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>

      <!-- ── 确认视图 ── -->
      <div class="confirm-view" style="display:none">
        <div class="confirm-message">确定要删除此任务吗？</div>
        <div class="confirm-actions">
          <button class="btn cancel-btn">取消</button>
          <button class="btn btn-confirm confirm-btn">确认删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Toast 通知容器 ═══ -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ═══ Scripts ═══ -->
  <script src="js/event-bus.js"></script>
  <script src="js/store.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/board.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
